<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dijkstra vs A* - side by side</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="compare.css">
</head>
<body class="compare-page">
  <header id="bar">
    <strong>Dijkstra vs A*</strong>
    <span id="status" class="status">Loading network...</span>
    <select id="mode" title="Objective">
      <option value="distance">Shortest distance</option>
      <option value="time">Fastest time</option>
    </select>
    <label class="inline">Speed <b id="speedLabel">1x</b>
      <input id="speed" type="range" min="0" max="2" step="1" value="1">
    </label>
    <button id="runBtn" class="primary" disabled>Run both</button>
    <button id="skipBtn" disabled>Skip</button>
    <button id="replayBtn" disabled>Replay</button>
    <button id="clearBtn">Clear</button>
    <button id="resetRoadsBtn">Reset roads</button>
    <a href="index.html">Single view</a>
  </header>
  <div id="summary" hidden></div>
  <div id="split">
    <section class="pane"><div id="mapL" class="map"></div><div id="hudL" class="hud"></div></section>
    <section class="pane"><div id="mapR" class="map"></div><div id="hudR" class="hud"></div></section>
  </div>
  <div id="toasts" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="api.js"></script>
  <script src="animation.js"></script>
  <script src="compare.js"></script>
</body>
</html>
